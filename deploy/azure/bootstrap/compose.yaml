services:
  cache:
    image: "${MBX_CACHE_IMAGE:?MBX_CACHE_IMAGE is required}"
    restart: unless-stopped
    env_file: cache.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - staging:/tmp
    networks: [internal]

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: mbx_cache
      POSTGRES_USER: mbx_cache
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbx_cache"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]

  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      MBX_CACHE_DOMAIN: "${MBX_CACHE_DOMAIN:?MBX_CACHE_DOMAIN is required}"
      CADDYFILE: |
        {$$MBX_CACHE_DOMAIN} {
            encode zstd gzip

            @metrics path /metrics
            respond @metrics 404

            reverse_proxy cache:8080 {
                health_uri /v1/status
            }
        }
    command:
      - sh
      - -ec
      - |
        printf '%s\n' "$$CADDYFILE" >/tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    depends_on:
      - cache
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    labels:
      dev.mbx-cache.config-hash: "${MBX_CACHE_PROMETHEUS_CONFIG_HASH:?MBX_CACHE_PROMETHEUS_CONFIG_HASH is required}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    depends_on:
      - cache
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    labels:
      dev.mbx-cache.config-hash: "${MBX_CACHE_GRAFANA_CONFIG_HASH:?MBX_CACHE_GRAFANA_CONFIG_HASH is required}"
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/mbx-cache.yml:/etc/grafana/provisioning/dashboards/mbx-cache.yml:ro
      - ./monitoring/grafana/dashboards/mbx-cache.json:/etc/grafana/dashboards/mbx-cache.json:ro
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_config: {}
  caddy_data: {}
  postgres: {}
  prometheus: {}
  staging: {}
