{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-mbx-cache
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: mbx-cache, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints:
    - port: http
      path: /metrics
      {{- if .Values.tls.secretName }}
      scheme: https
      {{- with .Values.serviceMonitor.tlsConfig }}
      tlsConfig: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
