apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mbx-cache
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: mbx-cache, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mbx-cache, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mbx-cache.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mbx-cache
          image: "{{ .Values.image.repository }}{{ with .Values.image.digest }}@{{ . }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: MBX_CACHE_STORAGE, value: {{ .Values.config.storage | quote }}}
            {{- with .Values.config.databaseUrlSecretRef }}
            - name: MBX_CACHE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "config.databaseUrlSecretRef.name is required" .name | quote }}, key: {{ required "config.databaseUrlSecretRef.key is required" .key | quote }}}}
            {{- else }}
            - {name: MBX_CACHE_DATABASE_URL, value: {{ required "config.databaseUrl or config.databaseUrlSecretRef is required" .Values.config.databaseUrl | quote }}}
            {{- end }}
            - {name: MBX_CACHE_DATABASE_MAX_CONNECTIONS, value: {{ .Values.config.databaseMaxConnections | quote }}}
            - {name: MBX_CACHE_DATABASE_ACQUIRE_TIMEOUT, value: {{ .Values.config.databaseAcquireTimeout | quote }}}
            {{- if eq .Values.config.storage "azure" }}
            - {name: MBX_CACHE_AZURE_ACCOUNT, value: {{ required "config.azureAccount is required for Azure storage" .Values.config.azureAccount | quote }}}
            - {name: MBX_CACHE_AZURE_CONTAINER, value: {{ required "config.azureContainer is required for Azure storage" .Values.config.azureContainer | quote }}}
            - {name: MBX_CACHE_AZURE_PREFIX, value: {{ .Values.config.azurePrefix | quote }}}
            - {name: MBX_CACHE_AZURE_CREDENTIAL_TYPE, value: {{ .Values.config.azureCredentialType | quote }}}
            {{- with .Values.config.azureEndpoint }}
            - {name: MBX_CACHE_AZURE_ENDPOINT, value: {{ . | quote }}}
            {{- end }}
            - {name: MBX_CACHE_AZURE_ALLOW_HTTP, value: {{ .Values.config.azureAllowHttp | quote }}}
            {{- else if eq .Values.config.storage "gcs" }}
            - {name: MBX_CACHE_GCS_BUCKET, value: {{ required "config.gcsBucket is required for GCS storage" .Values.config.gcsBucket | quote }}}
            - {name: MBX_CACHE_GCS_PREFIX, value: {{ .Values.config.gcsPrefix | quote }}}
            {{- else if eq .Values.config.storage "s3" }}
            - {name: MBX_CACHE_S3_BUCKET, value: {{ required "config.s3Bucket is required" .Values.config.s3Bucket | quote }}}
            - {name: MBX_CACHE_S3_PREFIX, value: {{ .Values.config.s3Prefix | quote }}}
            - {name: MBX_CACHE_S3_REGION, value: {{ .Values.config.s3Region | quote }}}
            - {name: MBX_CACHE_S3_ENDPOINT, value: {{ .Values.config.s3Endpoint | quote }}}
            - {name: MBX_CACHE_S3_PATH_STYLE, value: {{ .Values.config.s3PathStyle | quote }}}
            {{- end }}
            - {name: MBX_CACHE_MAX_BLOB_BYTES, value: {{ .Values.config.maxBlobBytes | quote }}}
            - {name: MBX_CACHE_MAX_SPOOL_BYTES, value: {{ .Values.config.maxSpoolBytes | quote }}}
            {{- if .Values.tls.secretName }}
            - {name: MBX_CACHE_TLS_CERT, value: /etc/mbx-cache/tls/tls.crt}
            - {name: MBX_CACHE_TLS_KEY, value: /etc/mbx-cache/tls/tls.key}
            {{- end }}
            - name: MBX_CACHE_TOKENS_JSON
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.tokensKey }}, optional: true}}
            - name: MBX_CACHE_OIDC_PROVIDERS_JSON
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.oidcProvidersKey }}, optional: true}}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $scheme := ternary "HTTPS" "HTTP" (not (empty .Values.tls.secretName)) }}
          readinessProbe: {httpGet: {path: /v1/status, port: http, scheme: {{ $scheme }}}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /v1/status, port: http, scheme: {{ $scheme }}}, initialDelaySeconds: 5}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.tls.secretName }}
            - {name: tls, mountPath: /etc/mbx-cache/tls, readOnly: true}
            {{- end }}
      volumes:
        {{- with .Values.tls.secretName }}
        - name: tls
          secret: {secretName: {{ . | quote }}}
        {{- end }}
        - name: tmp
          {{- if eq (toString .Values.config.maxSpoolBytes) "0" }}
          emptyDir: {}
          {{- else }}
          # Backstop past the spool budget the server enforces itself: going over
          # evicts the pod, but no longer fills the node's disk.
          emptyDir: {sizeLimit: {{ add (int64 .Values.config.maxSpoolBytes) 1073741824 }}}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
