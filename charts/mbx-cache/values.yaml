replicaCount: 2
image:
  repository: ghcr.io/jdx/mbx-cache
  tag: latest
  # Pins the image by digest (sha256:...); takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent
service:
  port: 8080
  annotations: {}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}
config:
  storage: s3
  databaseUrl: ""
  # Reads the URL from a Secret ({name, key}) instead of databaseUrl.
  databaseUrlSecretRef: {}
  databaseMaxConnections: 32
  # Seconds a request waits for a free database connection.
  databaseAcquireTimeout: 30
  azureAccount: ""
  azureContainer: ""
  azurePrefix: v1
  azureCredentialType: auto
  azureEndpoint: ""
  azureAllowHttp: false
  gcsBucket: ""
  gcsPrefix: v1
  s3Bucket: ""
  s3Prefix: v1
  s3Region: us-east-1
  s3Endpoint: ""
  s3PathStyle: false
  maxBlobBytes: "5368709120"
secret:
  existingSecret: mbx-cache
  tokensKey: tokens-json
  oidcProvidersKey: oidc-providers-json
serviceAccount:
  create: true
  name: ""
  annotations: {}
podAnnotations: {}
# distroless `nonroot` is uid 65532; the kubelet cannot check a non-numeric
# image USER against runAsNonRoot, so the ids are set explicitly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
extraEnv: []
envFrom: []
nodeSelector: {}
tolerations: []
affinity: {}
serviceMonitor:
  enabled: false
networkPolicy:
  enabled: true
