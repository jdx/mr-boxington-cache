name: release

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ""
      publish_main:
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.merge.outputs.digest }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, e.g. v0.1.0"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare container image
    # The numeric repository ID survives renames, unlike github.repository.
    if: github.repository_id == '1320413482'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} container image
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/jdx/mbx-cache
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.prepare.outputs.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: push
        with:
          context: .
          build-args: MBX_CACHE_BUILD_REVISION=${{ needs.prepare.outputs.sha }}
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/jdx/mbx-cache,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.artifact }}
          provenance: mode=max
          sbom: true
      - name: Export image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve the platform image digest: $DIGEST"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform container image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/jdx/mbx-cache
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.prepare.outputs.sha }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      - name: Create multi-platform manifest
        id: manifest
        env:
          REGISTRY_IMAGE: ghcr.io/jdx/mbx-cache
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          sources=()
          for digest in *; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid platform image digest: $digest"
              exit 1
            fi
            sources+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          if (( ${#sources[@]} != 2 )); then
            echo "::error::Expected two platform image digests, found ${#sources[@]}"
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          manifest=$(docker buildx imagetools inspect \
            "$REGISTRY_IMAGE:sha-$SOURCE_SHA" \
            --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<< "$manifest")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve the published manifest digest: $digest"
            exit 1
          fi
          platforms=$(jq -r \
            '[.manifests[] | select(.platform.os == "linux") | .platform.os + "/" + .platform.architecture] | unique | sort | join(",")' \
            <<< "$manifest")
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "::error::Unexpected published platforms: $platforms"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Promote the newest main image
        if: inputs.publish_main
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          latest_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$SOURCE_SHA" = "$latest_sha" ]; then
            docker buildx imagetools create \
              --tag ghcr.io/jdx/mbx-cache:main \
              "ghcr.io/jdx/mbx-cache@$DIGEST"
            echo "Promoted $SOURCE_SHA to ghcr.io/jdx/mbx-cache:main" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped main promotion because $SOURCE_SHA is no longer the head of main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          image="ghcr.io/jdx/mbx-cache@$DIGEST"
          printf '%s\n' "$image" | tee container-image.txt
          printf '### Container image\n\n%s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach image reference to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --draft \
              --generate-notes \
              --title "$TAG" \
              --verify-tag
          fi
          gh release upload "$TAG" container-image.txt \
            --repo "${{ github.repository }}" \
            --clobber
      - name: Publish manually recovered release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
