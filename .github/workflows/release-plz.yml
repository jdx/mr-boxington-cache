name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    # The numeric repository ID survives renames, unlike github.repository.
    if: github.repository_id == '1320413482'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    outputs:
      tag: ${{ steps.mbx-cache-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Find the mbx-cache tag
        id: mbx-cache-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "mbx-cache")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mbx-cache tag: ${tag:-<none released>}"
      - name: Reject an empty release result for a merged release PR
        if: steps.mbx-cache-tag.outputs.tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_pr=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | select(.head.ref | startswith("release-plz-"))][0].number // ""')
          if [ -n "$release_pr" ]; then
            echo "::error::release-plz returned no release after merging release PR #$release_pr"
            exit 1
          fi

  image:
    name: Publish container image
    needs: release
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.release.outputs.tag }}
      publish_main: true

  deploy:
    name: Deploy production
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: mbx-cache-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CACHE_URL: https://cache.mise.jdx.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The stored secret keeps its original name; it cannot easily be
      # recreated, so the rebrand deliberately did not rename it.
      MBX_CACHE_DATABASE_PASSWORD: ${{ secrets.MISE_CACHE_DATABASE_PASSWORD }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - name: Validate deployment configuration
        run: |
          missing=()
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            MBX_CACHE_DATABASE_PASSWORD \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            TS_AUDIENCE \
            TS_OAUTH_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal account ID'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.9

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.2
          install: false
          cache: false

      # The tailnet tag and the host's MagicDNS name are pre-rebrand identifiers
      # that live in Tailscale, not in this repository. See "Names that predate
      # the rebrand" in deploy/ovh/README.md before changing either.
      - name: Join the deployment tailnet
        id: tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:mise-cache-ci
          ping: mise-cache-prod.tail13c301.ts.net

      # Tailscale refuses the exchange when the trust credential's Subject does
      # not match the claim GitHub actually sends, and that claim appears in no
      # log on either side. Print it rather than guessing at it.
      - name: Explain a failed tailnet join
        if: failure() && steps.tailnet.conclusion == 'failure'
        env:
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          response=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --get --data-urlencode "audience=$TS_AUDIENCE" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL") || exit 0
          token=$(jq -er '.value | strings | select(length > 0)' <<<"$response") || exit 0
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="$payload==" ;;
            3) payload="$payload=" ;;
          esac
          claims=$(base64 -d <<<"$payload" 2>/dev/null) || exit 0
          echo 'The trust credential at https://login.tailscale.com/admin/settings/trust-credentials'
          echo 'must accept this Subject, exactly:'
          jq -r '"  \(.sub)"' <<<"$claims"
          jq -r '"issuer:      \(.iss)\nrepository:  \(.repository)\nenvironment: \(.environment // "<none>")"' <<<"$claims"
          if [ "$(jq -r '.aud | if type == "array" then join(",") else . end' <<<"$claims")" = "$TS_AUDIENCE" ]; then
            echo 'audience:    matches TS_AUDIENCE'
          else
            echo 'audience:    does NOT match TS_AUDIENCE, so the credential this'
            echo '             workflow names and the one it targets have diverged'
          fi
          echo 'Joining a tailnet also needs write on the auth_keys scope and the'
          echo 'tag the workflow advertises.'

      - name: Configure deployment outputs
        env:
          TF_VAR_cloudflare_account_id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_domain: cache.mise.jdx.dev
          TF_VAR_existing_server_ipv4: 15.204.81.200
          # Existing bucket; the R2 token is scoped to this exact name.
          TF_VAR_r2_bucket: mise-cache-production
        run: |
          terraform -chdir=deploy/ovh/terraform init -backend=false -input=false
          terraform -chdir=deploy/ovh/terraform apply -auto-approve -input=false

      - name: Deploy immutable image
        env:
          MBX_CACHE_DEPLOY_GITHUB_WORKFLOW_REF: jdx/mr-boxington-cache/.github/workflows/release-plz.yml@refs/heads/main
          MBX_CACHE_IMAGE: ${{ format('ghcr.io/jdx/mbx-cache@{0}', needs.image.outputs.digest) }}
          OVH_SSH_HOST: mise-cache-prod.tail13c301.ts.net
        run: |
          OVH_SSH_SOURCE_CIDR="$(tailscale ip -4)/32"
          export OVH_SSH_SOURCE_CIDR
          ./deploy/ovh/deploy.sh \
            --ssh-option=StrictHostKeyChecking=accept-new

      - name: Qualify OIDC, PostgreSQL, and R2
        env:
          CACHE_NAMESPACE: jdx/mr-boxington-cache
        run: |
          response=$(curl --fail --silent --show-error \
            --get \
            --data-urlencode "audience=$CACHE_URL" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          token=$(jq -er '.value | strings | select(length > 0)' <<<"$response")
          echo "::add-mask::$token"

          temporary_dir=$(mktemp -d "${RUNNER_TEMP}/mbx-cache-qualification.XXXXXXXX")
          trap 'rm -rf -- "$temporary_dir"' EXIT
          printf 'mbx-cache production qualification %s\n' "$GITHUB_SHA" >"$temporary_dir/input"
          digest=$(sha256sum "$temporary_dir/input" | cut -d ' ' -f 1)
          size=$(wc -c <"$temporary_dir/input")
          blob_url="$CACHE_URL/v1/blobs/sha256/$digest/$size"
          headers=(
            -H "Authorization: Bearer $token"
            -H "If-None-Match: *"
            -H "Mbx-Cache-Namespace: $CACHE_NAMESPACE"
            -H "Mbx-Cache-Protocol: 1"
          )

          curl --fail --silent --show-error \
            "${headers[@]}" \
            --upload-file "$temporary_dir/input" \
            "$blob_url"
          curl --fail --silent --show-error \
            "${headers[@]}" \
            --output "$temporary_dir/output" \
            "$blob_url"
          cmp "$temporary_dir/input" "$temporary_dir/output"
          echo "Production cache write/read qualification passed." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish GitHub release
    needs: [release, image]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  release-pr:
    name: Release PR
    needs: release
    if: github.repository_id == '1320413482'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
