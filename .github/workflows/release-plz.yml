name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A release in flight must finish (no cancel). The default queue keeps one pending run and
# replaces it with the newest: release-plz acts on the SHA it checked out, so stale runs queued
# from older commits would be wasteful.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # The numeric repository ID survives renames, unlike github.repository.
    if: github.repository_id == '1320413482'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    outputs:
      tag: ${{ steps.mbx-cache-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Exchanges the OIDC token for a short-lived crates.io token. The crate has
      # a Trusted Publisher naming this repository and this workflow file, so
      # renaming this file breaks publishing.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - id: release-plz
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - name: Find the mbx-cache tag
        id: mbx-cache-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "mbx-cache")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mbx-cache tag: ${tag:-<none released>}"
      - name: Reject an empty release result for a merged release PR
        if: steps.mbx-cache-tag.outputs.tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_pr=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | select(.head.ref | startswith("release-plz-"))][0].number // ""')
          if [ -n "$release_pr" ]; then
            echo "::error::release-plz returned no release after merging release PR #$release_pr"
            exit 1
          fi

  image:
    name: Publish container image
    needs: release
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.release.outputs.tag }}
      publish_main: true

  publish-release:
    name: Publish GitHub release
    needs: [release, image]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  release-pr:
    name: Release PR
    needs: release
    if: github.repository_id == '1320413482'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
