# Policy for `cargo deny check`, run from .github/workflows/ci.yml (bans,
# licenses and sources on every PR; advisories only when the dependency graph
# changes) and from the scheduled .github/workflows/advisories.yml (advisories
# against main, since the RustSec database changes independently of this repo).

[licenses]
# Permissive licenses only. A new dependency under anything else fails CI so
# the license can be reviewed before it is added here.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[advisories]
yanked = "deny"
ignore = [
  # Marvin Attack: timing sidechannel in `rsa`. Reachable only from the
  # `rsa` dev-dependency, which signs RSA keys for the OIDC test fixtures --
  # it is not in the shipped server. Upstream has no patched release ("No
  # safe upgrade is available"), so there is nothing to upgrade to and the
  # alternative is dropping RSA coverage from the tests. Revisit when
  # RustCrypto/RSA#626 lands a constant-time implementation.
  "RUSTSEC-2023-0071",
]
